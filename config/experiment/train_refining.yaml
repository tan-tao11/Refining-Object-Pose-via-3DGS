exp_name: train_refine
task_name: onepose_train_align

model:
  ckpt: null

  backbone:
    type: ResNetFPN
    resolution: [8, 2]
    resnetfpn:
      block_type: "BasicBlock"
      initial_dim: 128
      block_dims: [128, 196, 256]
      output_layers: [3, 1]
    pretrained: "weight/LoFTR_wsize9.ckpt"
    pretrained_fix: False

  render_feat_dim: 384
  patch_size: 8
  d_model: 256
  nhead: 8
  d_ffn: 1024
  dropout: 0.1
  num_rot_layers: 4
  num_trans_layers: 4

  positional_encoding:
    enable: True
    pos_emb_shape: [256, 256]

dataset:
  data_root: dataset/OnePose
  train_anno_file: ${merge_output_dir}/${task_name}/train.json
  val_anno_file: ${merge_output_dir}/${task_name}/val.json
  img_resize: [512, 512]
  sigma_rot: 0.2
  sigma_trans: 0.1

train:
  batch_size: 8
  data_workers: 4
  learning_rate: 1e-4
  max_epochs: 10
  save_dir: output/${exp_name}
  save_itr: 500
  val_itr: 500

  loss:
    rot_weight: 1.0
    trans_weight: 1.0

merge_output_dir: 'output/merged_anno'

gpus: '0,1'

save_dir: ckpts/${task_name}
